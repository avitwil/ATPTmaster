[project]
name = "atptmaster"
version = "0.1.0"
description = "Modular, orchestrator-agnostic autonomous pentest core (Kali)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Avi Twil", email = "avitwil@gmail.com" }]
dependencies = []                      # core is stdlib-only for portability

[project.scripts]
atpt = "atpt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atpt"]
